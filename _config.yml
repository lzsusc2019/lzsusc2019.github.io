# The Site Configuration
theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai

title: LZS
tagline: # 已删除副标题
description: >-
  LZS 的个人技术博客，专注于后端开发、分布式系统与 AI 代理。

url: "https://lzsusc2019.github.io"
baseurl: ""

author: LZS
social:
  name: LZS
  email: lzsusc2019@github.com
  links:
    - https://github.com/lzsusc2019

# Sidebar settings
avatar: /assets/img/avatar.jpg
toc: true
sidebar:
  - categories
  - tags
  - archives

# PWA
pwa:
  enabled: true

paginate: 10

# --- Collections ---
collections:
  tabs:
    output: true
    sort_by: order

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# --- Build settings ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# Archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-spaceship
