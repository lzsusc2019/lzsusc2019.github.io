# The Site Configuration
theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai

title: 刘泽圣的技术笔记
tagline: 后端架构 · 分布式系统 · AI Agent
description: >-
  记录后端平台架构、分布式系统与 AI Agent 工程化的实践与思考。
  涵盖调度与配置平台、密钥与安全治理、Agent Runtime 与多智能体协作。

url: "https://lzsusc2019.github.io"
baseurl: ""

author: 刘泽圣
social:
  name: 刘泽圣
  email: 15974286796@163.com
  links:
    - https://github.com/lzsusc2019

# Sidebar settings
avatar: /assets/img/avatar.jpg
toc: true
sidebar:
  - categories
  - tags
  - archives

# PWA
pwa:
  enabled: true

paginate: 10

# --- Collections ---
collections:
  tabs:
    output: true
    sort_by: order

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# --- Build settings ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# Archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-spaceship
